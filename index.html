<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMOUY</title>
    <link rel="icon" href="img/my photo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <section class="game">
            <header class="top">
                <div>
                    <h1>贪吃蛇</h1>
                    <p class="hint">方向键或 WASD 移动，空格暂停</p>
                </div>
                <div class="scores">
                    <div class="score">
                        <span>分数</span>
                        <strong id="score">0</strong>
                    </div>
                    <div class="score">
                        <span>最高</span>
                        <strong id="best">0</strong>
                    </div>
                </div>
            </header>

            <div class="board-wrap">
                <canvas id="board" width="480" height="480"></canvas>
                <div class="overlay" id="overlay">
                    <div class="card">
                        <h2 id="overlay-title">准备开始</h2>
                        <p id="overlay-text">吃到食物会变长，撞墙或咬到自己就结束。</p>
                        <button id="action" type="button">开始游戏</button>
                    </div>
                </div>
            </div>

            <div class="controls" aria-label="方向控制">
                <div class="controls-row">
                    <button class="pad" type="button" data-dir="up">上</button>
                </div>
                <div class="controls-row">
                    <button class="pad" type="button" data-dir="left">左</button>
                    <button class="pad" type="button" data-dir="down">下</button>
                    <button class="pad" type="button" data-dir="right">右</button>
                </div>
            </div>
        </section>
    </main>
    <script src="jiaoben.js"></script>
</body>
</html>
